apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: compile-go-
spec:
  pipelineRef:
    name: compile-go
  timeouts:
    pipeline: 20m
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 8Gi
